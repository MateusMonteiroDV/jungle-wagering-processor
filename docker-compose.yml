services:
  postgres:
    image: postgres:17-alpine
    container_name: jungle-wagering-postgres
    environment:
      POSTGRES_USER: wagering
      POSTGRES_PASSWORD: wagering_secret
      POSTGRES_DB: wagering
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U wagering -d wagering"]
      interval: 3s
      timeout: 3s
      retries: 20

  localstack:
    image: localstack/localstack:3.8
    container_name: jungle-wagering-localstack
    environment:
      SERVICES: sqs
      DEFAULT_REGION: us-east-1
      EAGER_SERVICE_LOADING: 1
    ports:
      - "4566:4566"
    volumes:
      - ./docker/localstack/init/ready.d:/etc/localstack/init/ready.d:ro
    healthcheck:
      test: ["CMD-SHELL", "awslocal sqs list-queues >/dev/null 2>&1"]
      interval: 3s
      timeout: 5s
      retries: 25

  migrate:
    build:
      context: .
      dockerfile: docker/Dockerfile
    container_name: jungle-wagering-migrate
    command: ["bun", "run", "scripts/migrate.ts", "up"]
    environment:
      NODE_ENV: production
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USER: wagering
      DB_PASSWORD: wagering_secret
      DB_NAME: wagering
      SQS_ENDPOINT: http://localstack:4566
    depends_on:
      postgres:
        condition: service_healthy
      localstack:
        condition: service_healthy
    restart: "no"

  app-1:
    build:
      context: .
      dockerfile: docker/Dockerfile
    container_name: jungle-wagering-app-1
    environment: &app-env
      NODE_ENV: production
      PORT: 3000
      INSTANCE_ID: app-1
      LOG_LEVEL: info
      RUN_HTTP: "true"
      RUN_CONSUMER: "true"
      RUN_OUTBOX: "true"
      RUN_PENDING: "true"
      RUN_DLQ_METRICS: "true"
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USER: wagering
      DB_PASSWORD: wagering_secret
      DB_NAME: wagering
      AWS_REGION: us-east-1
      AWS_ACCESS_KEY_ID: test
      AWS_SECRET_ACCESS_KEY: test
      SQS_ENDPOINT: http://localstack:4566
    ports:
      - "3001:3000"
    depends_on:
      migrate:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
      localstack:
        condition: service_healthy
    stop_grace_period: 30s
    healthcheck:
      test: ["CMD-SHELL", "bun -e 'fetch(\"http://localhost:3000/health/ready\").then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))'"]
      interval: 5s
      timeout: 3s
      retries: 15

  app-2:
    build:
      context: .
      dockerfile: docker/Dockerfile
    container_name: jungle-wagering-app-2
    environment:
      <<: *app-env
      INSTANCE_ID: app-2
    ports:
      - "3002:3000"
    depends_on:
      migrate:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
      localstack:
        condition: service_healthy
    stop_grace_period: 30s
    healthcheck:
      test: ["CMD-SHELL", "bun -e 'fetch(\"http://localhost:3000/health/ready\").then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))'"]
      interval: 5s
      timeout: 3s
      retries: 15

  app-3:
    build:
      context: .
      dockerfile: docker/Dockerfile
    container_name: jungle-wagering-app-3
    environment:
      <<: *app-env
      INSTANCE_ID: app-3
    ports:
      - "3003:3000"
    depends_on:
      migrate:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
      localstack:
        condition: service_healthy
    stop_grace_period: 30s
    healthcheck:
      test: ["CMD-SHELL", "bun -e 'fetch(\"http://localhost:3000/health/ready\").then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))'"]
      interval: 5s
      timeout: 3s
      retries: 15

volumes:
  postgres_data:
